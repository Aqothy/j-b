# Where to look for jobs. Format, under the section for the company's ATS:
#
#   Company Name: <ident>
#
# or, for a company with several boards:
#
#   Company Name:
#     - <ident>
#     - <ident>
#
# To add a company: open its careers page, click a job, and look at the URL.
#   boards.greenhouse.io/<ident>/...  or job-boards.greenhouse.io/<ident>/...  -> greenhouse
#   jobs.lever.co/<ident>/...                                                   -> lever
#   jobs.ashbyhq.com/<ident>/...                                                -> ashby
#   <tenant>.wd<N>.myworkdayjobs.com/<site>/...                                 -> workday (paste host/site)
# Then run `uv run jobhunt check <name>` to confirm it works, and commit.
# `uv run jobhunt suggest` lists boards behind recent Simplify postings that aren't here yet.
# To pause a company, comment out its line.

