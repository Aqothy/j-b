# Relevance rules. Philosophy: drop obvious mismatches, keep anything uncertain.
#
# Every pattern is a case-insensitive regular expression that must match whole words,
# so `engineer` does NOT match "engineering" -- write `engineer(ing)?` for that.
# Use (?-i:...) to make part of a pattern case-sensitive.

title:
  # A title must match at least one of these...
  include:
    - software
    - developers?
    - development
    - engineers?
    - engineering
    - programm(er|ing)
    - swe
    - sde
    - member of technical staff
    - full[- ]?stack
    - front[- ]?end
    - back[- ]?end
    - web
    - mobile
    - ios
    - android
    - cloud
    - devops
    - sre
    - site reliability
    - platform
    - infrastructure
    - systems
    - technology
    - tech
    - computer science
    - computer scientist
    - computing
    - ai
    - ml
    - machine learning
    - automation
    - python
    - java
    - compilers?

  # ...and, if this list is non-empty, also at least one of these. Currently internships only;
  # comment out every entry (or set `require: []`) to also get new grad and full-time roles.
  # Deliberately wide: a few non-internships slipping through is better than missing one.
  # Titles matching these also count as early-career (🟢, and "Senior ... Intern" is kept).
  # Jobs from Simplify's internship list skip this check: everything on it is an internship.
  require:
    - intern(ship)?s?
    - co[- ]?op
    - students?
    - stagiaire
    - summer
    - (fall|autumn|winter|spring)[ -]'?(20)?\d\d  # "Fall 2026", but not "Spring Boot"
    - off[- ]cycle
    - work[- ]?terms?
    - placements?
    - (?-i:PEY)  # UofT's Professional Experience Year
    - undergrad(uate)?s?
    - apprentice(ship)?s?
    - trainees?
    - extern(ship)?s?
    - fellow(ship)?s?
    - residency
    - practicum
    - early[- ](career|talent|in[- ]career)
    - university(?! grad)  # not "University Graduate", which is new grad
    - campus

  # Always dropped: degree requirements you don't have.
  exclude:
    - phd
    - mba
    - postdoc(toral)?

  # Dropped unless the title also has an early-career word (e.g. "Software Engineer / Principal ... New Grad").
  senior:
    - senior
    - sr\.?
    - (?<!technical )(?<!data )staff  # not "Member of Technical Staff", which some companies use for every level
    - principal
    - lead
    - manager
    - director
    - head of
    - vp
    - vice president
    - chief
    - architect
    - distinguished
    - (?-i:IV|V|VI)

  # Other disciplines that share words like "engineer" or "technology". Dropped unless the title
  # also clearly says software (so "Software Engineer - Hardware Tools" is kept).
  other_disciplines:
    - hardware
    - electrical
    - mechanical
    - civil
    - chemical
    - structural
    - manufacturing
    - industrial
    - process engineer
    - field engineer
    - asic
    - fpga
    - rtl
    - analog
    - silicon
    - rf
    - physical design
    - design verification
    - sales
    - account executive
    - business development
    - marketing
    - recruiters?
    - designer
    - technician
  clearly_software:
    - software
    - developers?
    - development
    - programm(er|ing)
    - full[- ]?stack
    - front[- ]?end
    - back[- ]?end

  # Titles matching these are marked 🟢 early-career; other relevant jobs are marked 🟡. Both notify.
  early_career:
    - intern(ship)?s?
    - co-?op
    - student
    - new grad(uate)?s?
    - graduate
    - university
    - campus
    - early[- ]career
    - entry[- ]level
    - junior
    - jr\.?
    - associate
    - apprentice(ship)?
    - residency
    - fellow(ship)?
    - (engineer|developer) (?-i:I|1)
    - 20\d\d

