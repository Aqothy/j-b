description:
  # Drop the job if the description (or Simplify's sponsorship field) matches one of these.
  exclude:
    - u\.?s\.? citizenship( is)? required
    - must be an? (\(i\) )?u\.?s\.? (citizen|person)
    - itar requirements
    - (requires|require|required|must have|must hold) (an? )?(active )?(u\.?s\.? )?(security|secret|top secret|ts/sci) clearance
    - active (secret|top secret|ts/sci) clearance

  # Shown on the notification when matched; never used to drop a job.
  flags:
    "(not|unable to|cannot|won't|will not|does not) (offer|provide|sponsor)[^.]{0,40}(sponsorship|visa)|does not offer sponsorship": "no visa sponsorship"
    "offers sponsorship": "offers sponsorship"
    "security clearance": "mentions security clearance"

  # Drop jobs whose smallest "N+ years ... experience" ask is at least this many years.
  # Smaller asks (e.g. 2-4 years) are kept and shown on the notification.
  drop_at_years: 5
